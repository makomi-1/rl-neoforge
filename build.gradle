plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "AliyunPublic"
        url = "https://maven.aliyun.com/repository/public"
    }
    maven {
        name = "AliyunCentral"
        url = "https://maven.aliyun.com/repository/central"
    }
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            srcDir('src/client/java')
            exclude 'com/makomi/datagen/**'
        }
        resources {
            srcDir('src/generated/resources')
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        testedMod = mods.named("${mod_id}")
        enable()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def syncJUnitWorkspace = tasks.register("syncJUnitWorkspace", Sync) {
    into layout.buildDirectory.dir("minecraft-junit/src")
    from("src/main") {
        into "main"
    }
    from("src/test/resources") {
        into "test/resources"
    }
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        mod_homepage           : mod_homepage,
        mod_sources            : mod_sources,
        mod_issues             : mod_issues
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named("test", Test).configure {
    dependsOn syncJUnitWorkspace
    description = "Run stable core contract tests (default verification gate)."
    maxParallelForks = 1
    useJUnitPlatform {
        includeTags "stable-core"
    }
}

def junitGameDir = layout.buildDirectory.dir("minecraft-junit")
def junitProgramArgsFile = layout.buildDirectory.file("moddev/junit/programArgs.txt")
def junitVmArgsFile = layout.buildDirectory.file("moddev/junit/vmArgs.txt")
def buildJUnitModFolders = {
    List<String> entries = []
    sourceSets.main.output.classesDirs.files.each { entries.add("${mod_id}%%${it.absolutePath}") }
    if (sourceSets.main.output.resourcesDir != null) {
        entries.add("${mod_id}%%${sourceSets.main.output.resourcesDir.absolutePath}")
    }
    sourceSets.test.output.classesDirs.files.each { entries.add("${mod_id}%%${it.absolutePath}") }
    if (sourceSets.test.output.resourcesDir != null) {
        entries.add("${mod_id}%%${sourceSets.test.output.resourcesDir.absolutePath}")
    }
    entries.join(';')
}

def taggedTestTasks = [
    [name: "testIntegration", tag: "integration", description: "Run integration tests (non-default gate)."],
    [name: "testClient", tag: "client", description: "Run client-only tests (non-default gate)."],
    [name: "testSlow", tag: "slow", description: "Run slow regression tests (non-default gate)."]
]

taggedTestTasks.each { config ->
    tasks.register(config.name, Test) {
        group = "verification"
        description = config.description
        dependsOn(
            syncJUnitWorkspace,
            tasks.named("downloadAssets"),
            tasks.named("writeNeoForgeTestClasspath"),
            tasks.named("prepareNeoForgeTestFiles")
        )
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        workingDir = junitGameDir.get().asFile
        maxParallelForks = 1
        systemProperty 'fml.junit.argsfile', junitProgramArgsFile.get().asFile.absolutePath
        systemProperty 'fml.modFolders', buildJUnitModFolders()
        jvmArgs("@${junitVmArgsFile.get().asFile.absolutePath}")
        shouldRunAfter(tasks.named("test"))
        useJUnitPlatform {
            includeTags config.tag
        }
        if (config.tag == "slow") {
            // NeoForge forgejunitdev 的启动与 FML 初始化会放大慢测抖动，这里只在任务层放宽口径，不改测试源码默认基线。
            systemProperty 'redstonelink.test.slow.saveMs', '60'
            systemProperty 'redstonelink.test.slow.loadMs', '60'
            systemProperty 'redstonelink.test.slow.queryMs', '10'
        }
    }
}

tasks.register("testExtended") {
    group = "verification"
    description = "Run stable-core plus non-default suites."
    dependsOn(
        tasks.named("test"),
        tasks.named("testIntegration"),
        tasks.named("testClient"),
        tasks.named("testSlow")
    )
}

tasks.register("testStableCore") {
    group = "verification"
    description = "Alias entry for stable core contract suite."
    dependsOn(tasks.named("test"))
}

tasks.named("testIntegration").configure {
    shouldRunAfter(tasks.named("test"))
}

tasks.named("testClient").configure {
    shouldRunAfter(tasks.named("testIntegration"))
}

tasks.named("testSlow").configure {
    shouldRunAfter(tasks.named("testClient"))
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
